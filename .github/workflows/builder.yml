name: Flake Builder 🏗️
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # DevShells & Formatter (per-platform)
  # ──────────────────────────────────────────────
  devshells:
    name: DevShells 🐚 (${{ matrix.target.system }})
    runs-on: ${{ matrix.target.runner }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          system: ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]
          include:
            - runner: "ubuntu-latest"
              system: "x86_64-linux"
            - runner: "ubuntu-24.04-arm"
              system: "aarch64-linux"
            - runner: "macos-latest"
              system: "aarch64-darwin"
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            eval-cores = 0
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Build devShells & formatter
        env:
          SYSTEM: ${{ matrix.target.system }}
        run: |
          FAILED=()
          BUILT=0
          SKIPPED=0

          ATTR="devShells.${SYSTEM}.default"
          if nix eval ".#${ATTR}.drvPath" --raw --no-write-lock-file >/dev/null 2>&1; then
            echo "🔨 Building ${ATTR}"
            if nix build ".#${ATTR}" --no-link -L; then
              echo "✅ Built ${ATTR}"
              BUILT=$((BUILT + 1))
            else
              echo "❌ Failed to build ${ATTR}" >&2
              FAILED+=("${ATTR}")
            fi
          else
            echo "⏭️  Skipping ${ATTR} (not evaluable for ${SYSTEM})"
            SKIPPED=$((SKIPPED + 1))
          fi

          # Build formatter if present.
          ATTR="formatter.${SYSTEM}"
          if nix eval ".#${ATTR}" --raw --no-write-lock-file >/dev/null 2>&1; then
            echo "🔨 Building ${ATTR}"
            if nix build ".#${ATTR}" --no-link -L; then
              echo "✅ Built ${ATTR}"
              BUILT=$((BUILT + 1))
            else
              echo "❌ Failed to build ${ATTR}" >&2
              FAILED+=("${ATTR}")
            fi
          fi

          echo ""
          echo "Built: ${BUILT}, Skipped: ${SKIPPED}, Failed: ${#FAILED[@]}"
          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "Failed outputs:"
            for f in "${FAILED[@]}"; do
              echo "  ✗ ${f}"
            done
            exit 1
          fi
